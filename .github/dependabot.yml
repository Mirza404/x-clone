version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-dependencies-minor:
        update-types:
          - minor
          - patch
      root-dependencies-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # ts-node 10.9.2 crashes on TS7's restructured ts.sys API; unpin once ts-node catches up.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      backend-dependencies-minor:
        update-types:
          - minor
          - patch
      backend-dependencies-major:
        update-types:
          - major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # @auth/mongodb-adapter peer-requires mongodb ^6; unpin once it supports v7.
      - dependency-name: 'mongodb'
        update-types: ['version-update:semver-major']
      # TS7 removes `baseUrl`; same ts-node incompatibility as the backend ignore above.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # eslint-plugin-react's peer range caps at eslint 9, so eslint-config-next can't
      # move to eslint 10 yet; unpin once it does.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    groups:
      frontend-dependencies-minor:
        update-types:
          - minor
          - patch
      frontend-dependencies-major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
