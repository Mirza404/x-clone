name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            script: format:check
          - name: Lint
            script: lint
          - name: Typecheck
            script: typecheck
          - name: Dependency Audit
            script: deps:check
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - run: npm run ${{ matrix.script }}

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URL: 'mongodb://localhost:27017/xclone-ci'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - run: npm test
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov-report/
          if-no-files-found: ignore
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov-report/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      MONGODB_URL: 'mongodb://localhost:27017/xclone-ci'
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXTAUTH_SECRET: 'ci-placeholder-secret'
      GOOGLE_CLIENT_ID: 'ci-placeholder-id'
      GOOGLE_CLIENT_SECRET: 'ci-placeholder-secret'
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: 'ci-placeholder'
      NEXT_PUBLIC_SERVER_URL: 'http://localhost:5000'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-deps
      - run: npm run build

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.21.2'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan for secrets
        run: ./gitleaks detect --source=. --redact -v

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, test, build, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lowercase image owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/x-clone-backend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/x-clone-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://x-clone-backend-vcsa.onrender.com
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/x-clone-frontend:latest
            ghcr.io/${{ steps.owner.outputs.name }}/x-clone-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy (backend)
        run: |
          curl -sSf -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_BACKEND_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

      - name: Trigger Render deploy (frontend)
        run: |
          curl -sSf -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_FRONTEND_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"
