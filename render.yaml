services:
  - type: web
    name: x-clone-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Presence and Socket.IO rooms are process-local until a shared adapter is added.
    numInstances: 1
    autoDeploy: false
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: FRONTEND_URL
        value: https://x-clone-frontend-voi9.onrender.com
      - key: BACKEND_JWT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Set true only during the observed backend-to-frontend cutover, then false.
      # Keeping this manually managed prevents a later Blueprint sync reopening it.
      - key: MEDIA_ALLOW_UNREGISTERED_CLOUDINARY
        sync: false

  - type: web
    name: x-clone-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    autoDeploy: false
    envVars:
      - key: NEXTAUTH_URL
        value: https://x-clone-frontend-voi9.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: NEXT_PUBLIC_SERVER_URL
        value: https://x-clone-backend-vcsa.onrender.com
      - key: MONGODB_URL
        sync: false
      - key: BACKEND_JWT_SECRET
        sync: false
